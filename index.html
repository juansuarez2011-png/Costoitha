<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntro Academy - Impacto ITHA</title>
    <style>
        :root {
            --bg: #1a1c1e;
            --card-bg: rgba(45, 49, 52, 0.9);
            --accent: #e67e22;
            --text: #ffffff;
            --safe: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            /* Efecto de relieve neomórfico oscuro */
            --shadow: 10px 10px 20px #0d0e0f, -5px -5px 15px #272a2d;
            --inset: inset 4px 4px 8px #0d0e0f, inset -4px -4px 8px #272a2d;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 900px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            height: 60px;
            width: auto;
        }

        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #cbd5e0; margin: 0; }

        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; color: #a0aec0; }

        .itha-controls { display: flex; align-items: center; gap: 15px; }
        
        /* Botones de ajuste neomórficos */
        .btn-step {
            width: 45px; height: 45px; border-radius: 12px; border: none;
            background: #2d3134; color: white; font-size: 1.5rem; cursor: pointer;
            box-shadow: var(--shadow); transition: 0.2s;
        }
        .btn-step:active { box-shadow: var(--inset); transform: scale(0.95); }

        input[type="range"] { flex-grow: 1; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: #1a1c1e; border-radius: 4px; box-shadow: var(--inset); }
        input[type="range"]::-webkit-slider-thumb { appearance: none; height: 22px; width: 22px; background: var(--accent); border-radius: 50%; margin-top: -7px; cursor: pointer; }

        input[type="number"] {
            width: 100%; border: none; padding: 12px; border-radius: 10px;
            background: #1a1c1e; color: white; font-weight: bold; font-size: 1.1rem;
            box-shadow: var(--inset); outline: none; box-sizing: border-box;
        }

        .visual-section { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Tacómetro */
        .gauge-container { position: relative; width: 280px; height: 140px; overflow: hidden; }
        .gauge-arc {
            width: 280px; height: 280px; border-radius: 50%;
            background: conic-gradient(from 270deg, var(--safe) 0% 30%, var(--warning) 30% 65%, var(--danger) 65% 100%);
            mask: radial-gradient(circle, transparent 48%, black 49%);
            -webkit-mask: radial-gradient(circle, transparent 48%, black 49%);
        }
        .needle {
            position: absolute; bottom: 0; left: 50%; width: 4px; height: 110px;
            background: #ffffff; transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5;
        }

        .display-val { font-size: 5rem; font-weight: 800; margin: 10px 0; }
        .status-text { font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }

        .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
        .res-card { 
            background: #2d3134; padding: 15px; border-radius: 18px; text-align: center;
            box-shadow: var(--shadow);
        }
        .res-card span { display: block; font-size: 0.65rem; color: #a0aec0; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .res-card strong { font-size: 1.2rem; color: #ff6b6b; }

        .total-box { 
            grid-column: span 3; background: linear-gradient(145deg, #c0392b, #a93226); 
            margin-top: 10px; padding: 20px;
        }
        .total-box strong { color: white; font-size: 1.8rem; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="Syntro Academy">
        </div>
        <h1>Impacto Productivo ITHA</h1>
    </div>

    <div class="main-layout">
        <div class="input-section">
            <div class="control-group">
                <label>Nivel de ITHA: <span id="itha-num" style="color:var(--accent)">72</span></label>
                <div class="itha-controls">
                    <button class="btn-step" onclick="changeItha(-1)">−</button>
                    <input type="range" id="itha-slider" min="60" max="100" value="72">
                    <button class="btn-step" onclick="changeItha(1)">+</button>
                </div>
            </div>

            <div class="control-group">
                <label>N° Vacas en Lote:</label>
                <input type="number" id="v-vacas" value="50">
            </div>

            <div class="control-group">
                <label>Mantenimiento ($/Día/Vaca):</label>
                <input type="number" id="v-mant" value="2.50" step="0.1">
            </div>

            <div class="control-group">
                <label>Precio Leche ($/Litro):</label>
                <input type="number" id="v-leche" value="0.50" step="0.05">
            </div>

            <div class="control-group">
                <label>Precio Carne ($/Kg Vivo):</label>
                <input type="number" id="v-carne" value="2.20" step="0.1">
            </div>
        </div>

        <div class="visual-section">
            <div class="gauge-container">
                <div class="gauge-arc"></div>
                <div class="needle" id="needle"></div>
            </div>
            <div class="display-val" id="big-val">72</div>
            <div class="status-text" id="status">CONFORT</div>
        </div>
    </div>

    <div class="results-grid">
        <div class="res-card"><span>Leche (Día)</span><strong id="r-leche">$0.00</strong></div>
        <div class="res-card"><span>IPP (Mes)</span><strong id="r-ipp">$0.00</strong></div>
        <div class="res-card"><span>Peso (Día)</span><strong id="r-peso">$0.00</strong></div>
        <div class="res-card total-box"><span>Pérdida Total Mes</span><strong id="r-total">$0.00</strong></div>
    </div>
</div>

<script>
    const slider = document.getElementById('itha-slider');
    
    function changeItha(delta) {
        slider.value = parseInt(slider.value) + delta;
        calc();
    }

    function calc() {
        const itha = parseInt(slider.value);
        const n = parseFloat(document.getElementById('v-vacas').value) || 0;
        const cm = parseFloat(document.getElementById('v-mant').value) || 0;
        const pl = parseFloat(document.getElementById('v-leche').value) || 0;
        const pc = parseFloat(document.getElementById('v-carne').value) || 0;

        // UI
        document.getElementById('itha-num').innerText = itha;
        document.getElementById('big-val').innerText = itha;
        document.getElementById('needle').style.transform = `translateX(-50%) rotate(${((itha-60)/40)*180 - 90}deg)`;

        let col = 'var(--safe)'; let txt = 'CONFORT';
        if(itha > 72) { col = 'var(--warning)'; txt = 'ESTRÉS LEVE'; }
        if(itha > 79) { col = 'var(--danger)'; txt = 'ESTRÉS SEVERO'; }
        document.getElementById('big-val').style.color = col;
        document.getElementById('status').innerText = txt;
        document.getElementById('status').style.color = col;

        // Fórmulas
        let pLeche = itha > 72 ? (itha - 72) * 1.075 * n * pl : 0;
        let pIpp = itha > 70 ? (itha - 70) * 1.5 * n * cm : 0;
        let pPeso = itha > 72 ? (itha - 72) * 0.05 * n * pc : 0;

        document.getElementById('r-leche').innerText = '$' + pLeche.toFixed(2);
        document.getElementById('r-ipp').innerText = '$' + pIpp.toFixed(2);
        document.getElementById('r-peso').innerText = '$' + pPeso.toFixed(2);
        
        let total = (pLeche * 30) + pIpp + (pPeso * 30);
        document.getElementById('r-total').innerText = '$' + total.toLocaleString(undefined, {minimumFractionDigits:2});
    }

    slider.addEventListener('input', calc);
    document.querySelectorAll('input[type="number"]').forEach(i => i.addEventListener('input', calc));
    calc();
</script>

</body>
</html>
